<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Default Title{% endblock %}</title>

    {% block head %}{% endblock %}
    {{ bootstrap.load_css() }}

    {% block styles %}
    {% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    <main class="flex-grow-1">
        <div class="container-lg py-4">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <p class="text-center border-top pt-3 mb-3">&copy; 2026 My App. All rights reserved.</p>
    </footer>

    {{ bootstrap.load_js() }}
</body>

</html>
